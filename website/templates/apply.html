{% extends "base.html" %}
{% block title %}Applying for {{ job.title }}{% endblock %}

{% block container_class %}wide{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/apply.css') }}">
{% endblock %}

{% block content %}
{% include "_partials/apply_content.html" %}
{% endblock %}

{% block scripts %}
<script>
const jobId = {{ job.id }};
const jobDescription = {{ job.description_text|tojson }};
const savedResumeText = {{ saved_resume_text|tojson if saved_resume_text else 'null' }};
let resumeText = savedResumeText || "";
let workAuthorization = null;
let lastCheckedScore = null;
let lastExplanation = "";
let chatHistory = [];
let unlockedStep = 1;

const modeSaved = document.getElementById("modeSaved");
const modeUpload = document.getElementById("modeUpload");
const modeLinkedin = document.getElementById("modeLinkedin");
const savedSection = document.getElementById("savedSection");
const uploadSection = document.getElementById("uploadSection");
const linkedinSection = document.getElementById("linkedinSection");

function syncMode() {
    const isSaved = modeSaved && modeSaved.checked;
    const isLinkedin = modeLinkedin.checked;
    if (savedSection) savedSection.style.display = isSaved ? "block" : "none";
    uploadSection.style.display = (!isSaved && !isLinkedin) ? "block" : "none";
    linkedinSection.style.display = isLinkedin ? "block" : "none";
}
if (modeSaved) modeSaved.addEventListener("change", syncMode);
modeUpload.addEventListener("change", syncMode);
modeLinkedin.addEventListener("change", syncMode);

function showError(elId, message) {
    document.getElementById(elId).innerHTML = message
        ? `<div class="error-message">${message}</div>`
        : "";
}

function goToStep(step) {
    for (let i = 1; i <= 4; i++) {
        document.getElementById(`panel${i}`).style.display = (i === step) ? "block" : "none";
        const nav = document.getElementById(`navStep${i}`);
        nav.classList.remove("active", "done", "disabled");
        if (i < step) nav.classList.add("done");
        else if (i === step) nav.classList.add("active");
        else if (i > unlockedStep) nav.classList.add("disabled");
    }
}

document.querySelectorAll(".wizard-step").forEach(navEl => {
    navEl.addEventListener("click", () => {
        const step = parseInt(navEl.dataset.step, 10);
        if (step <= unlockedStep) goToStep(step);
    });
});

document.getElementById("generateBtn").addEventListener("click", async () => {
    const linkedinUrl = document.getElementById("linkedinUrl").value.trim();
    const profileText = document.getElementById("profileText").value.trim();
    const btn = document.getElementById("generateBtn");

    showError("step1Error", null);
    if (!profileText) {
        showError("step1Error", "Paste your LinkedIn profile content first.");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

    try {
        const response = await fetch("/generate-profile-resume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ linkedin_url: linkedinUrl, profile_text: profileText })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Failed to generate resume.");

        resumeText = result.resume_text;
        showError("step1Error", null);
        btn.innerHTML = '<i class="fas fa-check"></i> Generated!';
    } catch (e) {
        showError("step1Error", e.message);
        btn.innerHTML = '<i class="fas fa-magic"></i> Generate Resume';
    } finally {
        btn.disabled = false;
    }
});

document.getElementById("toStep2Btn").addEventListener("click", async () => {
    const btn = document.getElementById("toStep2Btn");
    showError("step1Error", null);

    if (modeSaved && modeSaved.checked) {
        resumeText = savedResumeText;
    } else if (modeUpload.checked) {
        const file = document.getElementById("resumeFile").files[0];
        if (!file) {
            showError("step1Error", "Choose a resume file first.");
            return;
        }
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Reading file...';
        try {
            const formData = new FormData();
            formData.append("resume", file);
            const response = await fetch("/extract-resume-text", { method: "POST", body: formData });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Failed to read file.");
            resumeText = result.resume_text;
        } catch (e) {
            showError("step1Error", e.message);
            btn.disabled = false;
            btn.innerHTML = "Continue";
            return;
        }
        btn.disabled = false;
        btn.innerHTML = "Continue";
    } else {
        if (!resumeText) {
            showError("step1Error", "Generate your resume from LinkedIn first.");
            return;
        }
    }

    unlockedStep = Math.max(unlockedStep, 2);
    goToStep(2);
});

// --- Step 2: Work Authorization ---
const residenceCountry = document.getElementById("residenceCountry");
const signatureDate = document.getElementById("signatureDate");

function syncCountryLabels() {
    const country = residenceCountry.value;
    document.getElementById("countryLabel1").textContent = country;
    document.getElementById("countryLabel2").textContent = country;
    document.getElementById("countryLabel3").textContent = country;
}
residenceCountry.addEventListener("change", syncCountryLabels);
syncCountryLabels();

(function setToday() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    signatureDate.value = `${mm}/${dd}/${d.getFullYear()}`;
})();

document.getElementById("saveWorkAuthBtn").addEventListener("click", () => {
    showError("step2Error", null);

    const state = document.getElementById("residenceState").value.trim();
    const city = document.getElementById("residenceCity").value.trim();
    const postal = document.getElementById("residencePostal").value.trim();
    const authConfirm = document.getElementById("authConfirmCheck").checked;
    const remainWorking = document.getElementById("remainWorkingCheck").checked;
    const fullName = document.getElementById("signatureFullName").value.trim();
    const signature = document.getElementById("signatureText").value.trim();

    if (!state || !city || !postal) {
        showError("step2Error", "Fill in your full residence address first.");
        return;
    }
    if (!authConfirm || !remainWorking) {
        showError("step2Error", "Both work authorization confirmations are required to continue.");
        return;
    }
    if (!fullName || !signature) {
        showError("step2Error", "Provide your full legal name and signature to continue.");
        return;
    }

    workAuthorization = {
        country: residenceCountry.value,
        state, city, postal_code: postal,
        working_from_different_country: document.getElementById("differentCountryCheck").checked,
        work_authorization_confirmed: authConfirm,
        remain_working_confirmed: remainWorking,
        signature_full_name: fullName,
        signature_text: signature,
        signature_date: signatureDate.value,
    };

    document.getElementById("resumeTextArea").value = resumeText;
    unlockedStep = Math.max(unlockedStep, 3);
    goToStep(3);
});

document.getElementById("backTo1Btn").addEventListener("click", () => goToStep(1));

// --- Step 3: Check Match & Revise ---
function animateScoreCircle(score) {
    const circle = document.getElementById("scoreArc");
    const text = document.getElementById("scoreText");
    const radius = 15.9155;
    const circumference = 2 * Math.PI * radius;

    circle.setAttribute("stroke-dasharray", circumference + " " + circumference);
    circle.setAttribute("stroke-dashoffset", circumference);

    setTimeout(() => {
        const offset = circumference * (1 - score / 100);
        circle.setAttribute("stroke-dashoffset", offset);

        if (score < 30) circle.style.stroke = "#dc3545";
        else if (score < 61) circle.style.stroke = "#ffc107";
        else if (score < 81) circle.style.stroke = "#4a90e2";
        else circle.style.stroke = "#28a745";
    }, 100);

    let current = 0;
    const interval = setInterval(() => {
        if (current >= score) {
            clearInterval(interval);
        } else {
            current++;
            text.textContent = current + "%";
        }
    }, 12);
}

document.getElementById("checkScoreBtn").addEventListener("click", async () => {
    const btn = document.getElementById("checkScoreBtn");
    const text = document.getElementById("resumeTextArea").value.trim();
    showError("step3Error", null);

    if (!text) {
        showError("step3Error", "Your resume content is empty.");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

    try {
        const response = await fetch(`/jobs/${jobId}/preview-match`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ resume_text: text })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Failed to check match score.");

        resumeText = text;
        lastCheckedScore = result.score;
        lastExplanation = result.explanation;
        animateScoreCircle(result.score);

        const linesEl = document.getElementById("explanationLines");
        linesEl.innerHTML = "";
        result.explanation.split("\n").forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            const div = document.createElement("div");
            div.className = "match-line";
            if (trimmed.startsWith("+")) {
                div.innerHTML = `<i class="fa-solid fa-circle-check text-success me-2"></i>${trimmed.slice(1).trim()}`;
            } else if (trimmed.startsWith("-")) {
                div.innerHTML = `<i class="fa-solid fa-circle-xmark text-danger me-2"></i>${trimmed.slice(1).trim()}`;
            } else {
                div.textContent = trimmed;
            }
            linesEl.appendChild(div);
        });

        document.getElementById("scoreResult").style.display = "block";
        document.getElementById("scorePlaceholder").style.display = "none";
        document.getElementById("chatBoxWrap").style.display = "block";
        document.getElementById("toStep4Btn").disabled = false;
    } catch (e) {
        showError("step3Error", e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-bullseye"></i> Check Match Score';
    }
});

// --- Resume coaching chat (reuses /resume-chat) ---
function appendChatMessage(role, text) {
    const messagesEl = document.getElementById("chatMessages");
    const div = document.createElement("div");
    div.className = `chat-msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendChatMessage() {
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("chatSendBtn");
    const message = input.value.trim();
    if (!message) return;

    appendChatMessage("user", message);
    input.value = "";
    sendBtn.disabled = true;

    try {
        const response = await fetch("/resume-chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message,
                job_description: jobDescription,
                resume_analysis: lastExplanation,
                history: chatHistory,
            })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Failed to get a response.");

        appendChatMessage("assistant", result.reply);
        chatHistory.push({ role: "user", content: message });
        chatHistory.push({ role: "assistant", content: result.reply });
    } catch (e) {
        appendChatMessage("assistant", e.message);
    } finally {
        sendBtn.disabled = false;
    }
}

document.getElementById("chatSendBtn").addEventListener("click", sendChatMessage);
document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChatMessage();
});

document.getElementById("backTo2Btn").addEventListener("click", () => goToStep(2));
document.getElementById("backTo3Btn").addEventListener("click", () => goToStep(3));

document.getElementById("toStep4Btn").addEventListener("click", () => {
    const pill = document.getElementById("finalScorePreview");
    pill.textContent = lastCheckedScore;
    pill.className = "score-pill " + (lastCheckedScore >= 70 ? "high" : (lastCheckedScore >= 40 ? "mid" : "low"));
    unlockedStep = Math.max(unlockedStep, 4);
    goToStep(4);
});

document.getElementById("submitBtn").addEventListener("click", async () => {
    const btn = document.getElementById("submitBtn");
    showError("step4Error", null);

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

    try {
        const response = await fetch(`/jobs/${jobId}/apply`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                resume_text: document.getElementById("resumeTextArea").value,
                work_authorization: workAuthorization,
            })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Failed to submit application.");
        window.location = result.redirect_url;
    } catch (e) {
        showError("step4Error", e.message);
        btn.disabled = false;
        btn.innerHTML = "Submit Application";
    }
});
</script>
{% endblock %}
