<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Avant.AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .reset-card {
      background-color: #ffffff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo-container img {
      max-width: 160px;
      height: auto;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus {
      border-color: #5850ec;
      box-shadow: 0 0 0 3px rgba(88, 80, 236, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: #5850ec;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #4338ca;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <!-- Brand Logo -->
    <div class="logo-container">
      <img src="/static/Avants.png" alt="Avant.AI Logo">
    </div>

    <!-- Header -->
    <h1 class="title">Reset password</h1>
    <p class="subtitle">Enter your email to receive a reset link</p>

    <!-- Form -->
    <form class="form-group" action="#" method="POST">
      <input 
        type="email"
        name="email" 
        class="input-field" 
        placeholder="your@email.com" 
        required 
      />
      <button type="submit" class="btn-submit">Send Reset Link</button>
    </form>

    <!-- Navigation Link -->
    <a href="/login" class="back-link">Back to login</a>
  </div>

</body>
</html>
